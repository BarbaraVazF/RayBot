{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RayBot Dashboard</title>
  <link rel="stylesheet" href="{% static 'dashboard.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <button class="new-chat-btn">+ Nova Conversa</button>

      <div class="history">
        <p class="sidebar-title">Histórico de Conversas</p>
        <button class="history-item active">Chat Atual</button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main">
      <header class="topbar">
        <img src="{% static 'RAYBOT.svg' %}" alt="Logo RayBot" class="logo-raybot">
        <div class="topbar-actions">
          <button class="icon-btn">🗑 Limpar</button>
          <button class="icon-btn">📄 Exportar PDF</button>
          <button class="logout-btn" onclick="window.location.href='/'">⎋ Sair</button>
        </div>
      </header>

      <!-- CHAT AREA -->
      <div class="chat-area">
        <div class="chat-box" id="chat-box">
          <div class="bot-message fade-in">
            Olá! Sou o <strong>RayBot</strong>, seu assistente de IA especializado em indicadores, insights e análises preditivas.  
            Estou aqui para ajudá-lo a tomar decisões mais estratégicas e baseadas em seus dados.  
            Como posso ajudá-lo hoje?
          </div>
        </div>

        <!-- CHAT INPUT -->
        <form id="chat-form" class="chat-input">
          <input type="text" id="user-input" placeholder="Digite sua mensagem..." required>
          <button type="submit" class="send-btn">➤</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("chat-form");
      const input = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        const userMsg = document.createElement("div");
        userMsg.className = "user-message fade-in";
        userMsg.textContent = message;
        chatBox.appendChild(userMsg);

        chatBox.scrollTop = chatBox.scrollHeight;
        input.value = "";

        setTimeout(() => {
          const botMsg = document.createElement("div");
          botMsg.className = "bot-message fade-in";
          botMsg.textContent = "💬 Processando sua pergunta sobre " + message + "...";
          chatBox.appendChild(botMsg);
          chatBox.scrollTop = chatBox.scrollHeight;
        }, 800);
      });
    });
  </script>
</body>
</html>
