{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Trocar Senha — RayBot</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}">
  <style>
    body {
      background-color: #fafafa;
      font-family: "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      width: 360px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }
    button {
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #5b46f0, #9c67d3);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    .messages {
      margin-bottom: 10px;
    }
    .messages li {
      list-style: none;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Trocar Senha</h2>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <input type="password" name="senha_atual" placeholder="Senha atual" required>
      <input type="password" name="nova_senha" placeholder="Nova senha" required>
      <input type="password" name="confirmar_senha" placeholder="Confirmar nova senha" required>
      <button type="submit">Salvar nova senha</button>
    </form>
  </div>
</body>
</html>
