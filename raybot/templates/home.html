{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso RayBot</title>
  <link rel="stylesheet" href="{% static 'home.css' %}">
</head>

<body>
  <div class="container">
    <div class="card">
      <img src="{% static 'LogoRay.png' %}" alt="Logo Ray" class="logo">

      <h2 class="welcome">Bem-vindo ao RayBot</h2>
      <p class="subtitle">Digite seu usuário e senha para continuar</p>

      <form method="POST" action="{% url 'home' %}" class="form">
        {% csrf_token %}

        <input
          type="text"
          name="username"
          placeholder="Usuário"
          class="input"
          required
        />

        <div class="input-container">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Senha"
            class="input"
            required
          />
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar senha">👁️</button>
        </div>

        <button type="submit" class="button">
          Acessar RayBot
        </button>

        {% if form.errors %}
          <p class="error">Usuário ou senha inválidos.</p>
        {% endif %}
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");
      let visible = false;

      toggleBtn.addEventListener("click", () => {
        visible = !visible;
        passwordInput.type = visible ? "text" : "password";
        toggleBtn.textContent = visible ? "👁️" : "👁️";
      });
    });
  </script>
</body>
</html>
