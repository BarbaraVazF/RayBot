{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso RayBot</title>
  <link rel="stylesheet" href="{% static 'home.css' %}">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
</head>

<body>
  <div class="container">
    <div class="card">
      <img src="{% static 'LogoRay.png' %}" alt="Logo Ray" class="logo">

      <h2 class="welcome">Bem-vindo ao RayBot</h2>
      <p class="subtitle">Digite seu usuário e senha para continuar</p>

      <form method="POST" action="{% url 'home' %}" class="form">
        {% csrf_token %}

        <input
          type="text"
          name="username"
          placeholder="Usuário"
          class="input"
          required
        />

        <div class="input-container">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Senha"
            class="input"
            required
          />

          <button
            type="button"
            id="togglePassword"
            class="toggle-password"
            aria-label="Mostrar senha"
          >
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <button type="submit" class="button">
          Acessar RayBot
        </button>

        {% if form.errors %}
          <p class="error">Usuário ou senha inválidos.</p>
        {% endif %}
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");
      const icon = toggleBtn.querySelector("i");

      toggleBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";
        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
      });
    });
  </script>
</body>
</html>
