{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso RayBot</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>

<body>
  <div class="container">
    <div class="card">
      <img src="{% static 'LogoRay.png' %}" alt="Logo Ray" class="logo">

      <h2 class="welcome">Bem-vindo ao RayBot</h2>
      <p class="subtitle">Digite seu usuário e senha para continuar</p>

      <form method="POST" action="{% url 'home' %}" class="form">
        {% csrf_token %}

        <input
          type="text"
          name="username"
          placeholder="Usuário"
          class="input"
          required
        />

        <input
          type="password"
          name="password"
          placeholder="Senha"
          class="input"
          required
        />

        <button type="submit" class="button">
          Acessar RayBot
        </button>

        {% if form.errors %}
          <p style="color: red; margin-top: 10px;">Usuário ou senha inválidos.</p>
        {% endif %}
      </form>
    </div>
  </div>
</body>
</html>
